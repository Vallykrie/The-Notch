name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0-beta.1 (no release is published)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish DMG
    runs-on: macos-15
    # `secrets` cannot be read from a step-level `if`, so the presence checks below go
    # through job-level env instead.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # A fine-grained PAT with Contents: read and write on Vallykrie/homebrew-tap. The
      # built-in GITHUB_TOKEN is scoped to this repository only, so it cannot bump the cask.
      RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      # EdDSA private key for Sparkle, from `generate_keys` (docs/RELEASING.md). Read at job level
      # for the same reason as the others: a step-level `if` cannot read secrets.
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scripts/build-release.sh derives the build number from the commit count

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      # Signing is optional: without the secrets the DMG is still built, just ad-hoc
      # signed. That is enough to hand to a beta tester who is willing to right-click ->
      # Open, and it keeps the pipeline green before the Developer ID is in place.
      - name: Import Developer ID certificate
        id: signing
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Store notarytool credentials
        id: notary
        if: ${{ env.NOTARY_KEY != '' }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notch-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: ${{ steps.notary.outcome == 'success' && 'notch-notary' || '' }}
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Upload DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Notch-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      # The source repo is private, so its release assets 404 for anyone unauthenticated --
      # including Homebrew, which downloads with plain curl. The public artifacts repo holds
      # the DMG and nothing else; no source is ever pushed to it.
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          sha="$(awk '{print $1}' dist/*.dmg.sha256)"

          {
            echo "## The Notch $VERSION"
            echo
            echo "A macOS notch shell with a control surface for AI coding agents."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "brew install --cask vallykrie/tap/the-notch"
            echo '```'
            echo
            echo "Or download the DMG, drag **The Notch** to Applications, and launch it."
            echo "The app has no Dock icon — it lives in the notch."
            echo
            if [[ "$SIGNED" != "true" ]]; then
              echo "> **This build is not notarised.** macOS will refuse the first launch."
              echo "> Right-click the app in Applications and choose **Open**, then confirm,"
              echo "> or clear the quarantine flag:"
              echo '> ```bash'
              echo '> xattr -dr com.apple.quarantine "/Applications/The Notch.app"'
              echo '> ```'
              echo
            fi
            echo "### Requirements"
            echo
            echo "- macOS 14 or later"
            echo "- Apple silicon or Intel (universal build); Macs without a notch get a drawn one"
            echo
            echo "### Checksum"
            echo
            echo '```'
            echo "$sha  $(basename dist/*.dmg)"
            echo '```'
          } > release-notes.md

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi

          gh release create "$TAG" \
            --title "The Notch $VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            dist/*.dmg dist/*.dmg.sha256

      # Sparkle polls this feed to find updates. It lives on the `gh-pages` branch of this repo,
      # served by GitHub Pages at https://vallykrie.github.io/The-Notch/appcast.xml. The branch
      # holds the appcast and nothing else. The existing feed is fetched and extended, so every
      # earlier release stays in it.
      #
      # Each item's enclosure points at this tag's GitHub Release asset. An item without an EdDSA
      # signature is refused by Sparkle, so the step fails before anything is pushed.
      - name: Publish the Sparkle appcast
        if: ${{ github.event_name == 'push' && env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sparkle_version=2.10.0
          work="$RUNNER_TEMP/appcast"
          feed="$RUNNER_TEMP/feed"
          remote="https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git"
          mkdir -p "$work"

          # The gh-pages branch is cloned first: its appcast.xml is the feed this release extends.
          # The branch is created the first time the step runs.
          if ! git clone -q --depth 1 --branch gh-pages "$remote" "$feed" 2>/dev/null; then
            git init -q "$feed"
            git -C "$feed" checkout -q --orphan gh-pages
            git -C "$feed" remote add origin "$remote"
          fi
          cp -f "$feed/appcast.xml" "$work/appcast.xml" 2>/dev/null || true

          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP" ./bin

          cp dist/*.dmg "$work/"
          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
            --maximum-deltas 0 \
            "$work"

          if ! grep -q 'sparkle:edSignature' "$work/appcast.xml"; then
            echo "::error::the appcast has no EdDSA signature. Does SUPublicEDKey match SPARKLE_PRIVATE_KEY?"
            exit 1
          fi

          cp "$work/appcast.xml" "$feed/appcast.xml"
          cd "$feed"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast already lists $VERSION; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "appcast: the-notch $VERSION"
          git push -q origin HEAD:gh-pages

      - name: Warn when the appcast was skipped
        if: ${{ github.event_name == 'push' && env.SPARKLE_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::SPARKLE_PRIVATE_KEY is not set, so no Sparkle appcast was published." \
               "Installed copies will not see this release as an update."

      # Runs after the release exists, so the cask never points at a DMG that is not there yet.
      - name: Bump the Homebrew cask
        if: ${{ github.event_name == 'push' && env.RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(awk '{print $1}' dist/*.dmg.sha256)"

          git clone --depth 1 \
            "https://x-access-token:$RELEASE_TOKEN@github.com/Vallykrie/homebrew-tap.git" tap
          cask="tap/Casks/the-notch.rb"

          # Only the two generated lines change; everything else in the cask is hand-written.
          /usr/bin/sed -i '' -E \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            "$cask"

          grep -E '^  (version|sha256) ' "$cask"

          cd tap
          if git diff --quiet; then
            echo "Cask already at $VERSION; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "the-notch $VERSION"
          git push -q origin HEAD

      - name: Warn when the cask bump was skipped
        if: ${{ github.event_name == 'push' && env.RELEASE_TOKEN == '' }}
        run: |
          echo "::warning::RELEASE_REPO_TOKEN is not set, so the Homebrew cask was not bumped." \
               "brew install will keep serving the previous version."
