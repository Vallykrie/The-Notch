name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0-beta.1 (no release is published)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish DMG
    runs-on: macos-15
    # `secrets` cannot be read from a step-level `if`, so the presence checks below go
    # through job-level env instead.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # A PAT with `repo` scope on Vallykrie/the-notch-releases and
      # Vallykrie/homebrew-tap. The built-in GITHUB_TOKEN is scoped to this repository
      # only, so it cannot push the DMG or bump the cask.
      RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scripts/build-release.sh derives the build number from the commit count

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      # Signing is optional: without the secrets the DMG is still built, just ad-hoc
      # signed. That is enough to hand to a beta tester who is willing to right-click ->
      # Open, and it keeps the pipeline green before the Developer ID is in place.
      - name: Import Developer ID certificate
        id: signing
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Store notarytool credentials
        id: notary
        if: ${{ env.NOTARY_KEY != '' }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notch-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: ${{ steps.notary.outcome == 'success' && 'notch-notary' || '' }}
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Upload DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Notch-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      # The source repo is private, so its release assets 404 for anyone unauthenticated --
      # including Homebrew, which downloads with plain curl. The public artifacts repo holds
      # the DMG and nothing else; no source is ever pushed to it.
      - name: Mirror the DMG to the public releases repo
        if: ${{ github.event_name == 'push' && env.RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg)"
          sha="$(awk '{print $1}' dist/*.dmg.sha256)"

          {
            echo "## The Notch $VERSION"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "brew install --cask vallykrie/tap/the-notch"
            echo '```'
            echo
            echo "Or download the DMG and drag **The Notch** to Applications."
            echo "The app has no Dock icon — it lives in the notch."
            echo
            if [[ "$SIGNED" != "true" ]]; then
              echo "> **This build is not notarised.** macOS will refuse the first launch."
              echo "> Clear the quarantine flag once:"
              echo '> ```bash'
              echo '> xattr -dr com.apple.quarantine "/Applications/The Notch.app"'
              echo '> ```'
              echo
            fi
            echo "### Requirements"
            echo
            echo "- macOS 14 or later"
            echo "- Apple silicon or Intel (universal build)"
            echo
            echo "### Checksum"
            echo
            echo '```'
            echo "$sha  $(basename "$dmg")"
            echo '```'
          } > public-notes.md

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi

          gh release create "$TAG" \
            --repo Vallykrie/the-notch-releases \
            --title "The Notch $VERSION" \
            --notes-file public-notes.md \
            "${prerelease[@]}" \
            dist/*.dmg dist/*.dmg.sha256

      - name: Bump the Homebrew cask
        if: ${{ github.event_name == 'push' && env.RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(awk '{print $1}' dist/*.dmg.sha256)"

          git clone --depth 1 \
            "https://x-access-token:$RELEASE_TOKEN@github.com/Vallykrie/homebrew-tap.git" tap
          cask="tap/Casks/the-notch.rb"

          # Only the two generated lines change; everything else in the cask is hand-written.
          /usr/bin/sed -i '' -E \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            "$cask"

          grep -E '^  (version|sha256) ' "$cask"

          cd tap
          if git diff --quiet; then
            echo "Cask already at $VERSION; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "the-notch $VERSION"
          git push -q origin HEAD

      - name: Warn when the public mirror was skipped
        if: ${{ github.event_name == 'push' && env.RELEASE_TOKEN == '' }}
        run: |
          echo "::warning::RELEASE_REPO_TOKEN is not set, so the DMG was not mirrored to" \
               "the public releases repo and the Homebrew cask was not bumped." \
               "brew install will keep serving the previous version."

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          sha="$(awk '{print $1}' dist/*.dmg.sha256)"

          {
            echo "## The Notch $VERSION"
            echo
            echo "A macOS notch shell with a control surface for AI coding agents."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "brew install --cask vallykrie/tap/the-notch"
            echo '```'
            echo
            echo "Or download the DMG, drag **The Notch** to Applications, and launch it."
            echo "The app has no Dock icon — it lives in the notch."
            echo
            if [[ "$SIGNED" != "true" ]]; then
              echo "> **This build is not notarised.** macOS will refuse the first launch."
              echo "> Right-click the app in Applications and choose **Open**, then confirm,"
              echo "> or clear the quarantine flag:"
              echo '> ```bash'
              echo '> xattr -dr com.apple.quarantine "/Applications/The Notch.app"'
              echo '> ```'
              echo
            fi
            echo "### Requirements"
            echo
            echo "- macOS 14 or later"
            echo "- A Mac with a notch (the shell adapts, but it is built for one)"
            echo
            echo "### Checksum"
            echo
            echo '```'
            echo "$sha  $(basename dist/*.dmg)"
            echo '```'
          } > release-notes.md

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi

          gh release create "$TAG" \
            --title "The Notch $VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            dist/*.dmg dist/*.dmg.sha256
